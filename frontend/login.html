<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EHS Manager - Đăng nhập</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-100 flex items-center justify-center p-4"><div class="w-full max-w-md"><div class="text-center mb-6"><div class="inline-flex w-16 h-16 rounded-2xl bg-slate-900 text-white items-center justify-center text-3xl">🛡️</div><h1 class="text-2xl font-black mt-3">EHS MANAGER</h1><p class="text-sm text-slate-500">Incident • Investigation • CAPA • KPI</p></div><form id="form" class="bg-white rounded-2xl shadow-xl p-7 space-y-4"><div><label class="text-sm font-semibold">Tên đăng nhập</label><input id="u" class="mt-1 w-full border rounded-xl p-3" autocomplete="username" required></div><div><label class="text-sm font-semibold">Mật khẩu</label><input id="p" type="password" class="mt-1 w-full border rounded-xl p-3" autocomplete="current-password" required></div><button id="btn" class="w-full bg-blue-600 text-white rounded-xl p-3 font-bold">Đăng nhập</button><div id="msg" class="text-sm text-center"></div></form><p class="text-xs text-center text-slate-400 mt-4">Phiên làm việc được kiểm soát bằng token máy chủ.</p></div><script src="config.js"></script><script src="api.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('btn'),m=document.getElementById('msg');b.disabled=true;b.textContent='Đang xác thực...';const r=await API.post('login',{username:u.value,password:p.value});if(r.status==='success'){localStorage.setItem('ehs_user',JSON.stringify({token:r.token,...r.user}));location.href='index.html';}else{m.className='text-sm text-center text-red-600';m.textContent=r.message||'Đăng nhập thất bại';b.disabled=false;b.textContent='Đăng nhập';}};</script></body></html>
