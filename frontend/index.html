    // index.html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EHS Manager - Quản Lý An Toàn Sức Khỏe Môi Trường</title>

  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. FontAwesome 6 (Icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- 3. SheetJS (XLSX Export/Import) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">
    
    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 transition-all duration-300">
      <!-- Logo Header -->
      <div class="p-5 border-b border-slate-800 flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <h1 class="font-bold text-white text-base leading-none">EHS MANAGER</h1>
          <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">An Toàn & Môi Trường</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
        <a href="#" onclick="switchTab('dashboard')" id="nav-dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
          <i class="fa-solid fa-chart-pie w-5 text-center text-sm"></i>
          <span>Dashboard Tổng Quan</span>
        </a>

        <a href="#" onclick="switchTab('employee')" id="nav-employee" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
          <i class="fa-solid fa-users-gear w-5 text-center text-sm"></i>
          <span>Quản Lý Nhân Viên</span>
        </a>

        <a href="#" onclick="switchTab('accident')" id="nav-accident" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
          <i class="fa-solid fa-triangle-exclamation w-5 text-center text-sm"></i>
          <span>Báo Cáo Sự Cố</span>
        </a>

        <a href="#" onclick="switchTab('investigation')" id="nav-investigation" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium bg-blue-600 text-white transition shadow-sm">
          <i class="fa-solid fa-magnifying-glass-chart w-5 text-center text-sm"></i>
          <span>Điều Tra & CAPA</span>
        </a>
      </nav>

      <!-- User Profile Bottom -->
      <div class="p-4 border-t border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-white text-xs font-bold" id="userAvatar">
            EHS
          </div>
          <div class="truncate">
            <p class="text-xs font-medium text-white truncate" id="userName">Cán bộ EHS</p>
            <p class="text-[10px] text-slate-400 truncate">Quản trị viên</p>
          </div>
        </div>
        <button onclick="logout()" title="Đăng xuất" class="text-slate-400 hover:text-red-400 p-1.5 transition">
          <i class="fa-solid fa-right-from-bracket text-sm"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      
      <!-- TOP HEADER BAR -->
      <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-3">
          <h2 class="text-sm font-bold text-slate-700" id="currentPageTitle">ĐIỀU TRA SỰ CỐ & QUẢN LÝ CAPA</h2>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-xs text-slate-500" id="currentDateDisplay"></span>
        </div>
      </header>

      <!-- DYNAMIC CONTENT CONTAINER -->
      <main class="flex-1 overflow-y-auto" id="mainContent">
        <!-- Nội dung module sẽ được render động vào đây -->
      </main>

    </div>
  </div>

  <!-- NẠP CÁC FILE SCRIPT CẤU HÌNH VÀ MODULE -->
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="investigation.js"></script>

  <!-- SCRIPT KHỞI TẠO VÀ ĐIỀU HƯỚNG TAB -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Kiểm tra trạng thái đăng nhập
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      if (user) {
        document.getElementById('userName').innerText = user.name || user.username || 'Cán bộ EHS';
        document.getElementById('userAvatar').innerText = (user.name || user.username || 'E').charAt(0).toUpperCase();
      }

      // 2. Hiển thị ngày tháng hiện tại
      const now = new Date();
      document.getElementById('currentDateDisplay').innerText = now.toLocaleDateString('vi-VN', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

      // 3. Khởi tạo mặc định tab Investigation
      initInvestigationModule();
    });

    // Hàm chuyển đổi tab SPA
    function switchTab(tabName) {
      // Cập nhật trạng thái Active Sidebar
      const navs = ['dashboard', 'employee', 'accident', 'investigation'];
      navs.forEach(nav => {
        const el = document.getElementById(`nav-${nav}`);
        if (el) {
          if (nav === tabName) {
            el.className = "flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium bg-blue-600 text-white transition shadow-sm";
          } else {
            el.className = "flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition";
          }
        }
      });

      // Điều hướng khởi tạo Module tương ứng
      if (tabName === 'investigation' && typeof initInvestigationModule === 'function') {
        document.getElementById('currentPageTitle').innerText = "ĐIỀU TRA SỰ CỐ & QUẢN LÝ CAPA";
        initInvestigationModule();
      } else {
        document.getElementById('mainContent').innerHTML = `
          <div class="p-8 text-center text-slate-400 text-sm">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
            <p>Module <b>${tabName.toUpperCase()}</b> đang được phát triển...</p>
          </div>
        `;
      }
    }

    // Hàm Đăng xuất
    function logout() {
      if (confirm("Bạn có chắc chắn muốn đăng xuất không?")) {
        localStorage.removeItem('user');
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
