<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EHS Manager - Hệ Thống Quản Lý TNLĐ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js để vẽ biểu đồ Dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800">

  <div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0">
      <div class="p-4 text-xl font-bold border-b border-slate-800 flex items-center space-x-2">
        <i class="fa-solid fa-shield-halved text-blue-500"></i>
        <span>EHS MANAGER</span>
      </div>
      
      <!-- MENU CÓ PHÂN QUYỀN -->
      <nav id="sidebarMenu" class="flex-1 p-4 space-y-1 overflow-y-auto">
        <!-- Render tự động qua JS dựa trên Role -->
      </nav>

      <!-- USER INFO & LOGOUT -->
      <div class="p-4 border-t border-slate-800 flex items-center justify-between">
        <div>
          <div id="userDisplayName" class="font-bold text-sm">--</div>
          <div id="userDisplayRole" class="text-xs text-slate-400">--</div>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col overflow-y-auto">
      <!-- HEADER -->
      <header class="bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 id="pageTitle" class="text-xl font-bold text-slate-800">Dashboard Tổng Quan</h1>
        <span class="text-xs font-semibold px-2.5 py-1 rounded bg-blue-100 text-blue-800" id="currentYear">Năm 2026</span>
      </header>

      <!-- CONTAINER CHỨA NỘI DUNG -->
      <div id="mainContainer" class="p-6">
        <!-- Nội dung sẽ được nạp động từ Dashboard, Accident, Investigation... -->
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
  <script src="accident.js"></script>
</body>
</html>
