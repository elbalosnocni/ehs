<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EHS Manager - Hệ Thống Quản Lý TNLĐ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js để vẽ biểu đồ Dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800">

  <div class="flex h-screen overflow-hidden relative">

    <!-- OVERLAY NỀN ĐEN KHI MỞ MENU TRÊN MOBILE -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden md:hidden transition-opacity"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out shadow-xl md:shadow-none">
      <div class="p-4 text-xl font-bold border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-shield-halved text-blue-500"></i>
          <span>EHS MANAGER</span>
        </div>
        <!-- Nút đóng Sidebar trên Mobile -->
        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <!-- MENU CÓ PHÂN QUYỀN -->
      <nav id="sidebarMenu" class="flex-1 p-4 space-y-1 overflow-y-auto">
        <!-- Render tự động qua JS dựa trên Role -->
      </nav>

      <!-- USER INFO & LOGOUT -->
      <div class="p-4 border-t border-slate-800 flex items-center justify-between">
        <div>
          <div id="userDisplayName" class="font-bold text-sm">--</div>
          <div id="userDisplayRole" class="text-xs text-slate-400">--</div>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col overflow-y-auto w-full min-w-0">
      <!-- HEADER -->
      <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-20">
        <div class="flex items-center space-x-3">
          <!-- Nút Hamburger Menu mở Sidebar trên Mobile -->
          <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 focus:outline-none">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <h1 id="pageTitle" class="text-lg md:text-xl font-bold text-slate-800 truncate">Dashboard Tổng Quan</h1>
        </div>
        <span class="text-xs font-semibold px-2.5 py-1 rounded bg-blue-100 text-blue-800 flex-shrink-0" id="currentYear">Năm 2026</span>
      </header>

      <!-- CONTAINER CHỨA NỘI DUNG -->
      <div id="mainContainer" class="p-4 md:p-6 overflow-x-auto space-y-6">
        
        <!-- Tab Quản lý Nhân viên (Chuẩn giao diện Tailwind) -->
        <section id="employee" class="tab-content" style="display: none;">
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-users text-blue-600"></i>
              Quản lý Danh sách Nhân viên
            </h2>
            
            <!-- Khu vực Upload Excel -->
            <div class="mb-6 p-4 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center space-x-3 w-full sm:w-auto">
                <i class="fa-solid fa-file-excel text-emerald-600 text-2xl"></i>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
              </div>
              
              <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                <button id="btnUploadExcel" onclick="EmployeeModule.uploadExcel()" class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg transition duration-200 shadow-sm flex items-center justify-center gap-2">
                  <i class="fa-solid fa-cloud-arrow-up"></i>
                  Tải lên Sheet
                </button>
              </div>
            </div>
            
            <!-- Thông báo trạng thái -->
            <div id="uploadStatus" class="mb-4 text-sm font-semibold hidden"></div>

            <!-- Bảng hiển thị danh sách -->
            <div class="overflow-x-auto rounded-lg border border-slate-200">
              <table class="w-full text-sm text-left text-slate-600">
                <thead class="text-xs uppercase bg-slate-100 text-slate-700 border-b border-slate-200">
                  <tr>
                    <th scope="col" class="px-4 py-3 text-center w-12">STT</th>
                    <th scope="col" class="px-4 py-3">Mã NV</th>
                    <th scope="col" class="px-4 py-3">Họ tên</th>
                    <th scope="col" class="px-4 py-3">Bộ phận</th>
                    <th scope="col" class="px-4 py-3">Chức vụ</th>
                  </tr>
                </thead>
                <tbody id="employee-list" class="divide-y divide-slate-200">
                  <tr>
                    <td colspan="5" class="px-4 py-6 text-center text-slate-400">Chưa có dữ liệu</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

      </div>
      
    </main>
  </div>

  <!-- TOGGLE SIDEBAR SCRIPT -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }
  </script>

  <!-- THƯ VIỆN BÊN NGOÀI -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- MODULES HỆ THỐNG -->
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
  <script src="accident.js"></script>
  <script src="employee.js"></script>
</body>
</html>
