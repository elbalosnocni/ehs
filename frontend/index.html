<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EHS Manager - Hệ Thống Quản Lý TNLĐ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js cho Dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS đọc/xuất Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden relative">

    <!-- OVERLAY NỀN ĐEN KHI MỞ MENU TRÊN MOBILE -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden md:hidden transition-opacity"></div>

    <!-- SIDEBAR BÊN TRÁI -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out shadow-xl md:shadow-none">
      
      <!-- LOGO -->
      <div class="p-4 text-xl font-bold border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-shield-halved text-blue-500"></i>
          <span class="tracking-wide">EHS MANAGER</span>
        </div>
        <!-- Nút đóng Sidebar trên Mobile -->
        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <!-- MENU LIST (Render tự động từ common.js) -->
      <nav id="sidebarMenu" class="flex-1 p-4 space-y-1 overflow-y-auto">
        <!-- Javascript sẽ chèn các nút danh mục vào đây -->
      </nav>

      <!-- THÔNG TIN USER & ĐĂNG XUẤT -->
      <div class="p-4 border-t border-slate-800 flex items-center justify-between bg-slate-950/50">
        <div class="flex items-center space-x-3 overflow-hidden">
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs shrink-0 text-white">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="truncate">
            <p id="userDisplayName" class="text-xs font-semibold truncate text-slate-200">Admin</p>
            <p id="userDisplayRole" class="text-[10px] text-slate-400 truncate">Administrator</p>
          </div>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-red-400 transition p-2" title="Đăng xuất">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- CONTENT AREA (BÊN PHẢI) -->
    <div class="flex-1 flex flex-col overflow-hidden w-full min-w-0">
      
      <!-- HEADER TOPBAR -->
      <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 shadow-sm sticky top-0 z-20">
        <div class="flex items-center space-x-3">
          <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 focus:outline-none">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <h1 id="pageTitle" class="text-lg md:text-xl font-bold text-slate-800 truncate">Dashboard Tổng Quan</h1>
        </div>

        <div class="flex items-center space-x-3">
          <span id="currentYear" class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200 shrink-0">
            Năm 2026
          </span>
        </div>
      </header>

      <!-- MAIN CONTAINER (Nơi nội dung các Module được render vào) -->
      <main id="mainContainer" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50">
        <div class="flex items-center justify-center h-full text-slate-400">
          <i class="fa-solid fa-spinner fa-spin text-2xl mr-2"></i> Đang tải dữ liệu hệ thống...
        </div>
      </main>

    </div>
  </div>

  <!-- SCRIPT BẬT TẮT SIDEBAR MOBILE -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (sidebar && overlay) {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
      }
    }
  </script>

  <!-- NẠP CÁC FILE JAVASCRIPT THEO ĐÚNG THỨ TỰ -->
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
  <script src="accident.js"></script>
  <script src="employee.js"></script>

</body>
</html>
